<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電卓</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#fff8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1rem;gap:1rem}
.top-bar{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;padding-top:0.25rem;background:#E8843A;border-radius:14px;padding:10px 14px}
.back-link{font-size:13px;color:#E8843A;text-decoration:none;padding:6px 14px;border-radius:8px;background:#fff3ec}
.page-title{font-size:17px;font-weight:700;color:#fff}
.card{background:#fff;border-radius:16px;padding:1.5rem;width:100%;max-width:420px;box-shadow:0 2px 12px rgba(232,132,58,0.12);border:1px solid #fde8d4}
h2{font-size:14px;font-weight:600;color:#c06830;margin-bottom:1rem}
.denom-row{display:flex;align-items:center;gap:10px;background:#fff8f0;border:1px solid #fde8d4;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.icon-5000{background:#FDECD8;color:#7a3e10}
.icon-1000{background:#FDF3E8;color:#8a5a20}
.icon-500{background:#FEF8F0;color:#a07030}
.label-name{font-size:15px;font-weight:500;color:#1a1a1a;flex:1}
input[type=number]{width:60px;text-align:center;font-size:16px;font-weight:500;border:1px solid #ddd;border-radius:8px;padding:5px 4px;background:#fff;color:#1a1a1a;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]:focus{outline:none;border-color:#E8843A}
.subtotal{font-size:13px;color:#666;min-width:70px;text-align:right}
.total-box{background:#E8843A;color:#fff;border-radius:12px;padding:1rem 1.4rem;display:flex;justify-content:space-between;align-items:center;margin:0.75rem 0}
.total-label{font-size:14px;color:rgba(255,255,255,0.7)}
.total-val{font-size:28px;font-weight:500}
.ticket-input{font-size:16px;font-weight:500;border:1px solid #ddd;border-radius:8px;padding:8px 10px;color:#1a1a1a;-moz-appearance:textfield;width:100%}
.ticket-input::-webkit-inner-spin-button,.ticket-input::-webkit-outer-spin-button{-webkit-appearance:none}
.ticket-input:focus{outline:none;border-color:#E8843A}
.ticket-result{background:#c06830;color:#fff;border-radius:12px;padding:1rem 1.4rem;display:flex;justify-content:space-between;align-items:center;margin:0.75rem 0}
.ticket-result-label{font-size:14px;color:rgba(255,255,255,0.6)}
.ticket-result-val{font-size:28px;font-weight:500}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.field-label{font-size:11px;color:#aaa;margin-bottom:4px}
.rec-btn{width:100%;padding:11px;border-radius:10px;border:none;background:#E8843A;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.rec-btn:active{opacity:0.85}
.reset-btn{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;background:transparent;color:#999;font-size:14px;cursor:pointer;font-family:inherit;margin-top:8px}
/* 履歴 */
.history-list{display:flex;flex-direction:column;gap:8px}
.hist-item{background:#f9f9f7;border:1px solid #e8e8e4;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start}
.hist-left{display:flex;flex-direction:column;gap:3px}
.hist-tag{font-size:10px;color:#aaa;font-weight:500}
.hist-val{font-size:18px;font-weight:700;color:#1a1a1a}
.hist-note{font-size:11px;color:#999}
.hist-time{font-size:11px;color:#bbb;white-space:nowrap;padding-top:2px}
.del-btn{background:none;border:none;cursor:pointer;color:#ddd;font-size:14px;padding:0 0 0 8px}
.del-btn:active{color:#f55}
.empty{text-align:center;color:#bbb;padding:2rem;font-size:14px}
.clear-btn{width:100%;padding:10px;border:1px solid #eee;border-radius:8px;background:transparent;color:#ccc;font-size:13px;cursor:pointer;font-family:inherit;margin-top:8px}
.clear-btn:active{color:#999}
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="back-link">← 戻る</a>
  <span class="page-title">🧮 電卓</span>
</div>

<!-- 準備金電卓 -->
<div class="card">
  <h2>準備金 電卓</h2>
  <div class="denom-row">
    <div class="icon icon-5000">5000</div>
    <div class="label-name">5,000円</div>
    <input type="number" id="c-5000" placeholder="0" min="0" oninput="calcUpdate()">
    <span class="subtotal" id="cs-5000">¥0</span>
  </div>
  <div class="denom-row">
    <div class="icon icon-1000">1000</div>
    <div class="label-name">1,000円</div>
    <input type="number" id="c-1000" placeholder="0" min="0" oninput="calcUpdate()">
    <span class="subtotal" id="cs-1000">¥0</span>
  </div>
  <div class="denom-row">
    <div class="icon icon-500">500</div>
    <div class="label-name">500円</div>
    <input type="number" id="c-500" placeholder="0" min="0" oninput="calcUpdate()">
    <span class="subtotal" id="cs-500">¥0</span>
  </div>
  <div class="total-box">
    <span class="total-label">合計</span>
    <span class="total-val" id="c-total">¥0</span>
  </div>
  <button class="rec-btn" onclick="recordCash()">+ 履歴に記録</button>
  <button class="reset-btn" onclick="resetCash()">リセット</button>
</div>

<!-- チケット枚数電卓 -->
<div class="card">
  <h2>チケット枚数 電卓</h2>
  <div class="field-row">
    <div>
      <div class="field-label">スタート番号</div>
      <input type="number" class="ticket-input" id="t-start" placeholder="開始番号" min="0" oninput="ticketCalc()">
    </div>
    <div>
      <div class="field-label">ラスト（次の番号）</div>
      <input type="number" class="ticket-input" id="t-last" placeholder="次の番号" min="0" oninput="ticketCalc()">
    </div>
  </div>
  <div class="ticket-result">
    <span class="ticket-result-label">売った枚数</span>
    <span class="ticket-result-val" id="t-count">— 枚</span>
  </div>
  <button class="rec-btn" onclick="recordTicket()">+ 履歴に記録</button>
  <button class="reset-btn" onclick="resetTicket()">リセット</button>
</div>

<!-- 計算履歴 -->
<div class="card" style="padding-bottom:1rem">
  <h2>計算履歴</h2>
  <div class="history-list" id="hist-list"><div class="empty">まだ記録がありません</div></div>
  <button class="clear-btn" onclick="clearHistory()">履歴をすべて削除</button>
</div>

<script>
const HIST_KEY='calc-history';

function fmt(n){return '¥'+n.toLocaleString('ja-JP');}
function now(){const d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
function todayLabel(){const d=new Date();const days=['日','月','火','水','木','金','土'];return(d.getMonth()+1)+'月'+d.getDate()+'日（'+days[d.getDay()]+'）';}

/* 準備金 */
const denoms=[5000,1000,500];
function v(d){return Math.max(0,parseInt(document.getElementById('c-'+d).value)||0);}
function calcUpdate(){
  let total=0;
  denoms.forEach(d=>{const n=v(d),sub=n*d;total+=sub;document.getElementById('cs-'+d).textContent=fmt(sub);});
  document.getElementById('c-total').textContent=fmt(total);
}
function resetCash(){
  denoms.forEach(d=>{document.getElementById('c-'+d).value='';document.getElementById('cs-'+d).textContent='¥0';});
  document.getElementById('c-total').textContent='¥0';
}
function recordCash(){
  const total=denoms.reduce((s,d)=>s+v(d)*d,0);
  if(total===0){alert('金額を入力してください');return;}
  const detail=denoms.filter(d=>v(d)>0).map(d=>v(d)+'×'+d.toLocaleString()).join(' / ');
  addHistory({type:'準備金',val:fmt(total),note:detail,time:now(),date:todayLabel()});
}

/* チケット */
function ticketCalc(){
  const s=parseInt(document.getElementById('t-start').value);
  const l=parseInt(document.getElementById('t-last').value);
  const el=document.getElementById('t-count');
  if(!isNaN(s)&&!isNaN(l)&&l>s){el.textContent=(l-s)+'枚';}
  else{el.textContent='— 枚';}
}
function resetTicket(){
  document.getElementById('t-start').value='';
  document.getElementById('t-last').value='';
  document.getElementById('t-count').textContent='— 枚';
}
function recordTicket(){
  const s=parseInt(document.getElementById('t-start').value);
  const l=parseInt(document.getElementById('t-last').value);
  if(isNaN(s)||isNaN(l)||l<=s){alert('スタートとラストを正しく入力してください');return;}
  addHistory({type:'チケット',val:(l-s)+'枚',note:s+'番〜'+(l-1)+'番',time:now(),date:todayLabel()});
}

/* 履歴 */
function loadHistory(){try{return JSON.parse(localStorage.getItem(HIST_KEY))||[];}catch(e){return[];}}
function saveHistory(h){localStorage.setItem(HIST_KEY,JSON.stringify(h));}
function addHistory(entry){
  const h=loadHistory();
  h.unshift(entry);
  saveHistory(h);
  renderHistory();
}
function deleteHistory(i){
  const h=loadHistory();
  h.splice(i,1);
  saveHistory(h);
  renderHistory();
}
function clearHistory(){
  if(!confirm('履歴をすべて削除しますか？'))return;
  localStorage.removeItem(HIST_KEY);
  renderHistory();
}
function renderHistory(){
  const h=loadHistory();
  const el=document.getElementById('hist-list');
  if(h.length===0){el.innerHTML='<div class="empty">まだ記録がありません</div>';return;}
  el.innerHTML=h.map((e,i)=>`
    <div class="hist-item">
      <div class="hist-left">
        <span class="hist-tag">${e.type} · ${e.date} ${e.time}</span>
        <span class="hist-val">${e.val}</span>
        <span class="hist-note">${e.note}</span>
      </div>
      <button class="del-btn" onclick="deleteHistory(${i})">✕</button>
    </div>`).join('');
}

renderHistory();
</script>
</body>
</html>
