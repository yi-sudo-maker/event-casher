<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>準備金電卓</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f5f5f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:1rem;gap:1rem}
.card{background:#fff;border-radius:16px;padding:1.5rem;width:100%;max-width:420px;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
h1{font-size:16px;font-weight:500;color:#888;margin-bottom:1.25rem}
/* 準備金 */
.denom-row{display:flex;align-items:center;gap:10px;background:#f9f9f7;border:1px solid #e8e8e4;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.icon-5000{background:#EEEDFE;color:#3C3489}
.icon-1000{background:#E1F5EE;color:#085041}
.icon-500{background:#FAEEDA;color:#633806}
.label{flex:1}
.label-name{font-size:15px;font-weight:500;color:#1a1a1a}
.label-count{font-size:12px;color:#999;margin-top:2px}
.ctrl{display:flex;align-items:center;gap:6px}
.btn{width:32px;height:32px;border-radius:8px;border:1px solid #ddd;background:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#333;flex-shrink:0}
.btn:active{transform:scale(0.95)}
input[type=number]{width:54px;text-align:center;font-size:16px;font-weight:500;border:1px solid #ddd;border-radius:8px;padding:5px 4px;background:#fff;color:#1a1a1a;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]:focus{outline:none;border-color:#7F77DD}
.subtotal{font-size:13px;color:#666;min-width:70px;text-align:right}
.total-box{background:#1a1a1a;color:#fff;border-radius:12px;padding:1.1rem 1.4rem;display:flex;justify-content:space-between;align-items:center;margin:1rem 0 0.75rem}
.total-label{font-size:14px;color:#aaa}
.total-val{font-size:28px;font-weight:500}
.reset{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;background:transparent;color:#999;font-size:14px;cursor:pointer;font-family:inherit}
/* チケット */
.ticket-input{font-size:16px;font-weight:500;border:1px solid #ddd;border-radius:8px;padding:8px 10px;color:#1a1a1a;-moz-appearance:textfield;width:100%}
.ticket-input::-webkit-inner-spin-button,.ticket-input::-webkit-outer-spin-button{-webkit-appearance:none}
.ticket-input:focus{outline:none;border-color:#7F77DD}
.add-btn{padding:8px 14px;border-radius:8px;border:none;background:#7F77DD;color:#fff;font-size:14px;cursor:pointer;flex-shrink:0;font-family:inherit;white-space:nowrap}
.add-btn:active{opacity:0.8}
.jump-btn{width:100%;padding:9px;border-radius:8px;border:1.5px dashed #ccc;background:transparent;color:#888;font-size:13px;cursor:pointer;font-family:inherit;margin:4px 0 12px}
.jump-btn:active{background:#f5f5f0}
/* 束 */
.bundle{background:#f9f9f7;border:1px solid #e8e8e4;border-radius:12px;padding:12px;margin-bottom:10px}
.bundle-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.bundle-title{font-size:12px;font-weight:600;color:#7F77DD}
.bundle-del{background:none;border:none;cursor:pointer;color:#ccc;font-size:15px;padding:0}
.bundle-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.bundle-field label{display:block;font-size:11px;color:#aaa;margin-bottom:3px}
.bundle-result{text-align:right;font-size:13px;color:#7F77DD;font-weight:600}
/* 現在履歴 */
.history{margin:4px 0 8px;padding:0;list-style:none}
.history li{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#555;padding:5px 8px;background:#fff;border:1px solid #eee;border-radius:7px;margin-bottom:3px}
.history li .h-left{display:flex;flex-direction:column;gap:1px}
.history li .h-no{color:#aaa;font-size:10px}
.history li .h-num{font-weight:600;font-size:14px}
.history li .h-diff{color:#7F77DD;font-weight:500;font-size:12px}
.history li .del-btn{background:none;border:none;cursor:pointer;color:#ccc;font-size:14px;padding:0 0 0 6px}
.cur-row{display:flex;gap:8px;margin-bottom:4px}
.ticket-total-box{background:#3C3489;color:#fff;border-radius:12px;padding:1rem 1.4rem;display:flex;justify-content:space-between;align-items:center;margin:0.75rem 0 0.75rem}
.ticket-total-label{font-size:14px;color:rgba(255,255,255,0.6)}
.ticket-total-val{font-size:28px;font-weight:500}
.divider{border:none;border-top:1px solid #eee;margin:0.5rem 0 0.75rem}
</style>
</head>
<body>

<!-- 準備金 カード -->
<div class="card">
  <h1>準備金 電卓</h1>

  <div class="denom-row">
    <div class="icon icon-5000">5000</div>
    <div class="label"><div class="label-name">5,000円</div><div class="label-count" id="sub-5000">0枚</div></div>
    <div class="ctrl">
      <button class="btn" onclick="change(5000,-1)">−</button>
      <input type="number" id="cnt-5000" placeholder="0" min="0" oninput="update()">
      <button class="btn" onclick="change(5000,1)">＋</button>
    </div>
    <span class="subtotal" id="st-5000">¥0</span>
  </div>

  <div class="denom-row">
    <div class="icon icon-1000">1000</div>
    <div class="label"><div class="label-name">1,000円</div><div class="label-count" id="sub-1000">0枚</div></div>
    <div class="ctrl">
      <button class="btn" onclick="change(1000,-1)">−</button>
      <input type="number" id="cnt-1000" placeholder="0" min="0" oninput="update()">
      <button class="btn" onclick="change(1000,1)">＋</button>
    </div>
    <span class="subtotal" id="st-1000">¥0</span>
  </div>

  <div class="denom-row">
    <div class="icon icon-500">500</div>
    <div class="label"><div class="label-name">500円</div><div class="label-count" id="sub-500">0枚</div></div>
    <div class="ctrl">
      <button class="btn" onclick="change(500,-1)">−</button>
      <input type="number" id="cnt-500" placeholder="0" min="0" oninput="update()">
      <button class="btn" onclick="change(500,1)">＋</button>
    </div>
    <span class="subtotal" id="st-500">¥0</span>
  </div>

  <div class="total-box">
    <span class="total-label">合計金額</span>
    <span class="total-val" id="grand-total">¥0</span>
  </div>
  <button class="reset" onclick="resetCash()">リセット</button>
</div>

<!-- カウンター カード -->
<div class="card">
  <h1>外国人カウンター</h1>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
    <div>
      <div style="font-size:11px;color:#aaa;margin-bottom:4px">カウンター 1</div>
      <input type="number" class="ticket-input" id="cnt-a" placeholder="0" min="0" oninput="cntUpdate()">
    </div>
    <div>
      <div style="font-size:11px;color:#aaa;margin-bottom:4px">カウンター 2</div>
      <input type="number" class="ticket-input" id="cnt-b" placeholder="0" min="0" oninput="cntUpdate()">
    </div>
  </div>
  <div style="background:#085041;color:#fff;border-radius:12px;padding:1rem 1.4rem;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <span style="font-size:14px;color:rgba(255,255,255,0.6)">合計人数</span>
    <span style="font-size:28px;font-weight:500" id="cnt-total">— 人</span>
  </div>
  <button class="reset" onclick="resetCnt()">リセット</button>
</div>

<!-- チケット カード -->
<div class="card">
  <h1>チケット枚数</h1>

  <!-- 束リスト -->
  <div id="bundle-list"></div>

  <!-- 番号が飛んだボタン -->
  <button class="jump-btn" onclick="addBundle()">＋ 番号が飛んだ（新しい束を追加）</button>

  <hr class="divider">

  <!-- 現在の進捗記録 -->
  <ul class="history" id="t-history"></ul>
  <div class="cur-row">
    <input type="number" class="ticket-input" id="t-current" placeholder="現在の番号を記録" min="0">
    <button class="add-btn" onclick="addCurrent()">記録</button>
  </div>

  <div class="ticket-total-box">
    <span class="ticket-total-label">打った枚数（合計）</span>
    <span class="ticket-total-val" id="t-total">— 枚</span>
  </div>
  <button class="reset" onclick="resetTicket()">リセット</button>
</div>

<script>
/* ===== カウンター ===== */
function cntUpdate(){
  const a=parseInt(document.getElementById('cnt-a').value)||0;
  const b=parseInt(document.getElementById('cnt-b').value)||0;
  document.getElementById('cnt-total').textContent=(a+b)+'人';
}
function resetCnt(){
  document.getElementById('cnt-a').value='';
  document.getElementById('cnt-b').value='';
  document.getElementById('cnt-total').textContent='— 人';
}

/* ===== 準備金 ===== */
const denoms = [5000, 1000, 500];
function val(d){return Math.max(0,parseInt(document.getElementById('cnt-'+d).value)||0)}
function fmt(n){return '¥'+n.toLocaleString('ja-JP')}
function update(){
  let total=0;
  denoms.forEach(d=>{
    const n=val(d),sub=n*d;
    total+=sub;
    document.getElementById('st-'+d).textContent=fmt(sub);
    document.getElementById('sub-'+d).textContent=n+'枚';
  });
  document.getElementById('grand-total').textContent=fmt(total);
}
function change(d,delta){
  const el=document.getElementById('cnt-'+d);
  el.value=Math.max(0,val(d)+delta);
  update();
}
function resetCash(){
  denoms.forEach(d=>{
    document.getElementById('cnt-'+d).value='';
    document.getElementById('st-'+d).textContent='¥0';
    document.getElementById('sub-'+d).textContent='0枚';
  });
  document.getElementById('grand-total').textContent='¥0';
}

/* ===== チケット ===== */
let bundles=[];   // [{start, last}]
let curHistory=[]; // [{num, time}]

function addBundle(){
  bundles.push({start:null,last:null});
  renderBundles();
}

function removeBundle(i){
  bundles.splice(i,1);
  renderBundles();
}

function bundleVal(i,field){
  const el=document.getElementById('b-'+field+'-'+i);
  return el?parseInt(el.value)||null:null;
}

function renderBundles(){
  const container=document.getElementById('bundle-list');
  container.innerHTML='';
  bundles.forEach((b,i)=>{
    const s=bundleVal(i,'start');
    const l=bundleVal(i,'last');
    const count=(s!=null&&l!=null&&l>=s)?(l-s)+'枚':'—';
    const div=document.createElement('div');
    div.className='bundle';
    div.innerHTML=`
      <div class="bundle-header">
        <span class="bundle-title">束 ${i+1}</span>
        <button class="bundle-del" onclick="removeBundle(${i})">✕</button>
      </div>
      <div class="bundle-fields">
        <div class="bundle-field">
          <label>スタート</label>
          <input type="number" class="ticket-input" id="b-start-${i}" placeholder="開始番号" value="${b.start!=null?b.start:''}" oninput="onBundleInput(${i})">
        </div>
        <div class="bundle-field">
          <label>ラスト</label>
          <input type="number" class="ticket-input" id="b-last-${i}" placeholder="最終番号" value="${b.last!=null?b.last:''}" oninput="onBundleInput(${i})">
        </div>
      </div>
      <div class="bundle-result">${count}</div>`;
    container.appendChild(div);
  });
  ticketUpdate();
}

function onBundleInput(i){
  bundles[i].start=bundleVal(i,'start');
  bundles[i].last=bundleVal(i,'last');
  // update just this bundle's result
  const s=bundles[i].start;
  const l=bundles[i].last;
  const resEl=document.getElementById('bundle-list').querySelectorAll('.bundle-result')[i];
  if(resEl) resEl.textContent=(s!=null&&l!=null&&l>=s)?(l-s)+'枚':'—';
  ticketUpdate();
}

function prevNum(idx){
  if(idx===0){
    // use first bundle's start
    return bundles.length>0?bundles[0].start:null;
  }
  return curHistory[idx-1].num;
}

function renderHistory(){
  const ul=document.getElementById('t-history');
  ul.innerHTML='';
  curHistory.forEach((entry,i)=>{
    const prev=prevNum(i);
    const diff=(prev!=null)?'+'+(entry.num-prev)+'枚':'';
    const li=document.createElement('li');
    li.innerHTML=`<span class="h-left"><span class="h-no">#${i+1} ${entry.time}</span><span class="h-num">${entry.num}</span></span><span class="h-diff">${diff}</span><button class="del-btn" onclick="removeHistory(${i})">✕</button>`;
    ul.appendChild(li);
  });
  ticketUpdate();
}

function addCurrent(){
  const el=document.getElementById('t-current');
  const num=parseInt(el.value);
  if(isNaN(num)) return;
  const now=new Date();
  const time=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  curHistory.push({num,time});
  el.value='';
  renderHistory();
}

function removeHistory(i){
  curHistory.splice(i,1);
  renderHistory();
}

function ticketUpdate(){
  const totalEl=document.getElementById('t-total');
  // sum all completed bundles
  let total=0;
  let hasAny=false;
  bundles.forEach(b=>{
    if(b.start!=null&&b.last!=null&&b.last>=b.start){
      total+=b.last-b.start;
      hasAny=true;
    }
  });
  if(hasAny){
    totalEl.textContent=total+'枚';
  } else {
    totalEl.textContent='— 枚';
  }
}

function resetTicket(){
  bundles=[];
  curHistory=[];
  document.getElementById('bundle-list').innerHTML='';
  document.getElementById('t-current').value='';
  document.getElementById('t-history').innerHTML='';
  document.getElementById('t-total').textContent='— 枚';
}

// 起動時に1束目を追加
addBundle();
</script>
</body>
</html>
